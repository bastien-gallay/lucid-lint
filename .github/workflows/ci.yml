name: CI

on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main, 'release/*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a push→main / release-tag run:
  # those are the baseline (cross-os, dogfood) whose result we want on record.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      docs: ${{ steps.filter.outputs.docs }}
      infra: ${{ steps.filter.outputs.infra }}
      prose: ${{ steps.filter.outputs.prose }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'src/**/*.rs'
              - 'tests/**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - 'rustfmt.toml'
            docs:
              - 'docs/**/*.md'
              - '*.md'
            infra:
              - '.github/workflows/**'
              - 'justfile'
              - 'scripts/**'
            prose:
              - 'src/**/*.rs'
              - 'docs/**/*.md'
              - '*.md'
              - 'scripts/**/*.py'
              - '.github/workflows/**'

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master (no semver tags upstream)
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master (no semver tags upstream)
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Run clippy
        run: cargo clippy --all-features --all-targets --workspace -- -D warnings

  test:
    name: Test (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    env:
      # Opt-in gate checked by `tests/rule_docs_coverage.rs`: when set,
      # any rule source modified versus `origin/main` must be mentioned in
      # the CHANGELOG `## [Unreleased]` section.
      RULE_DOCS_GATE_GIT: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Fetch full history so the docs-gate test can diff against origin/main.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master (no semver tags upstream)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Run tests
        run: cargo test --all-features --workspace

  cross-os:
    name: Test (${{ matrix.os }})
    needs: changes
    # Cross-platform coverage is a post-merge signal, not a PR gate. It runs on
    # push to `main` and to `release/*` branches — never on PRs — and is
    # deliberately excluded from `ci-success`. The release process cuts tags
    # from a `release/*` branch, so the pre-release run happens when those
    # commits are pushed to the branch (ci.yml has no `tags:` trigger; tags are
    # handled by release.yml). A red run here surfaces a platform-specific
    # regression without slowing day-to-day PRs (mirrors the `cross-os` split in
    # the faceto/termherd sibling repos).
    if: >-
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.rust == 'true' ||
       needs.changes.outputs.docs == 'true' ||
       needs.changes.outputs.infra == 'true')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so the docs-gate test can diff against origin/main.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master (no semver tags upstream)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Run tests
        run: cargo test --all-features --workspace

  msrv:
    name: MSRV (Minimum Supported Rust Version)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Extract MSRV from Cargo.toml
        id: msrv
        run: |
          VERSION=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Check builds with MSRV
        run: cargo check --all-features --workspace

  docs:
    name: Build docs (mdBook)
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so check_lang_staleness.py can resolve each
          # EN page's last-touching commit (shallow clone only sees
          # the merge commit and reports every page as stale).
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master (no semver tags upstream)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Install mdBook
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: mdbook
      - name: Build mdBook
        run: cd docs && mdbook build
      - name: FR content-staleness check (F92 sub-task)
        # Strict on PRs since 2026-05-02: any FR page whose
        # `en-source-sha` stamp lags its EN counterpart's last-touching
        # commit fails the build. The initial stale backlog was
        # reconciled in commit 438fa48b (2026-05-01); main has been
        # `--strict` via docs-deploy.yml since the same date. Pair-locks
        # filename parity (F92) with content parity (F92 sub-task).
        run: python3 scripts/check_lang_staleness.py --strict
      - name: Build rustdoc
        run: cargo doc --all-features --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"

  deny:
    name: Supply-chain (cargo-deny)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install cargo-deny
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-deny
      - name: Run cargo-deny
        run: cargo deny --all-features check

  actionlint:
    name: Workflow lint (actionlint)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install actionlint
        # Upstream-recommended downloader. taiki-e/install-action does
        # not provide actionlint, and the cargo-binstall fallback fails
        # because the upstream crate isn't published with prebuilt
        # binaries.
        id: install
        # The downloader script is pinned to actionlint's v1.7.7 commit SHA
        # (immutable) and its content verified against a known sha256 before
        # execution, so we never `curl | bash` an unverified remote script
        # (OpenSSF Scorecard Pinned-Dependencies).
        env:
          ACTIONLINT_SHA: 03d0035246f3e81f36aed592ffb4bebf33a03106 # v1.7.7
          DOWNLOADER_SHA256: 221d1d16c03e4e4fcd867de34104e8d479bdce20ccdfa553b9a5c0dc29bf6af2
        run: |
          curl -fsSL -o download-actionlint.bash \
            "https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_SHA}/scripts/download-actionlint.bash"
          echo "${DOWNLOADER_SHA256}  download-actionlint.bash" | sha256sum --check --status
          bash download-actionlint.bash 1.7.7
          echo "path=$(pwd)/actionlint" >> "$GITHUB_OUTPUT"
      - name: Run actionlint
        run: ${{ steps.install.outputs.path }} -color

  typos:
    name: Spell check (typos)
    needs: changes
    if: needs.changes.outputs.prose == 'true' || needs.changes.outputs.infra == 'true'
    # Signal, not a gate. A typo fails this job (visible red check) but never
    # blocks a merge, because branch protection requires only `ci-success` and
    # this job is deliberately excluded from its `needs`. We do NOT use
    # `continue-on-error` here: that can render the check green and hide the
    # signal — a plain non-required failing job is the reliably-visible one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run typos
        # Config (paths to scan, exclusions, allowlist) lives in
        # `.typos.toml` so local `typos` runs match CI.
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0

  link-check:
    name: Link check (internal, offline)
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.infra == 'true'
    # Internal links only, and deterministic (never flaky): `--offline` verifies
    # that local/relative link targets exist and makes ZERO network requests, so
    # a live-but-intermittent host can never redden this job. External link
    # liveness is time-based rot handled by the weekly `link-health.yml` cron —
    # the only place that touches the network. A broken *internal* link is a
    # real, PR-caused defect: it fails here as a visible red check. Currently a
    # non-required signal (excluded from `ci-success`); since it is now
    # deterministic it could be promoted to a gate by adding it to
    # `ci-success`'s `needs`.
    #
    # Do NOT add `--exclude 'file://'` here: in offline mode lychee resolves
    # every relative link to a `file://` URL, so that pattern would exclude all
    # local links and silently turn this job into a no-op (0 checked). The
    # `file://` exclude lives only in `link-health.yml`, whose job is the
    # opposite — check *external* links and skip the local ones.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: "v0.23.0"
          fail: true
          args: >-
            --no-progress
            --offline
            --exclude '\.html$'
            --exclude-path docs/book
            --exclude-path docs/src/SUMMARY.md
            README.md
            docs/src/**/*.md

  dogfood:
    name: Dogfood on project docs
    needs: [changes, fmt, clippy, test]
    if: |
      always() &&
      (needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.infra == 'true') &&
      (needs.fmt.result == 'success' || needs.fmt.result == 'skipped') &&
      (needs.clippy.result == 'success' || needs.clippy.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master (no semver tags upstream)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Build binary
        run: cargo build --release --locked
      - name: Lint our own docs
        run: |
          ./target/release/lucid-lint check \
            README.md \
            CONTRIBUTING.md \
            CODING_STANDARDS.md \
            AGENTS.md \
            docs/src/ \
            || echo "::warning::lucid-lint found issues in its own docs (non-blocking)"

  ci-success:
    name: CI success
    # Single required status check for branch protection. Branch protection
    # pins ONLY this job name, so underlying jobs can be renamed, added, or
    # matrix-ified without breaking the ruleset (which matches required checks
    # by exact name). This job aggregates the real PR gates and fails if any of
    # them failed or was cancelled. Path-skipped jobs report `skipped`, which
    # is treated as passing.
    #
    # Deliberately EXCLUDED from `needs` (they are signals / post-merge, never
    # PR gates): `cross-os`, `typos`, `link-check`, `dogfood`. Coverage lives in
    # its own workflow and is likewise non-blocking.
    needs: [changes, fmt, clippy, test, msrv, docs, deny, actionlint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required CI jobs failed or were cancelled:"
          echo "  changes=${{ needs.changes.result }} fmt=${{ needs.fmt.result }} clippy=${{ needs.clippy.result }} test=${{ needs.test.result }}"
          echo "  msrv=${{ needs.msrv.result }} docs=${{ needs.docs.result }} deny=${{ needs.deny.result }} actionlint=${{ needs.actionlint.result }}"
          exit 1
      - name: All required jobs passed
        run: echo "All required CI jobs passed or were skipped."
