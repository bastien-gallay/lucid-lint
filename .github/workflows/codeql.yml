name: CodeQL

# Static analysis for the Rust workspace. CodeQL builds the project,
# extracts a database, and runs the `security-and-quality` query suite.
# Findings land in the Security tab as code-scanning alerts. Pairs with
# `cargo audit` (CVE-driven, dependency-side) and Clippy (style + simple
# soundness, in-tree) — CodeQL adds whole-program SAST: taint tracking,
# control-flow, cross-function patterns Clippy cannot see.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly run catches drift in the query packs themselves: GitHub
    # ships new queries that may flag code that was already on main.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (Rust)
    # Runs on every push/PR to main (no path gate) so SAST covers all
    # commits on the default branch — OpenSSF Scorecard's SAST check
    # measures the fraction of commits scanned, and a `paths-filter`
    # gate left doc/chore commits unscanned.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to code-scanning
      actions: read            # required for private repos; harmless on public

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master (no semver tags upstream)
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: rust
          queries: security-and-quality

      - name: Autobuild
        # CodeQL's autobuilder runs `cargo build` for Rust. Explicit
        # build steps would only matter for non-default targets.
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2

      - name: Perform analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:rust"
