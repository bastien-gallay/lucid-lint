name: CodeQL

# Static analysis for the Rust workspace. CodeQL builds the project,
# extracts a database, and runs the `security-and-quality` query suite.
# Findings land in the Security tab as code-scanning alerts. Pairs with
# `cargo audit` (CVE-driven, dependency-side) and Clippy (style + simple
# soundness, in-tree) — CodeQL adds whole-program SAST: taint tracking,
# control-flow, cross-function patterns Clippy cannot see.

on:
  push:
    branches: [main]
  schedule:
    # Weekly run catches drift in the query packs themselves: GitHub
    # ships new queries that may flag code that was already on main.
    - cron: '0 7 * * 1'
  workflow_dispatch:

# No `pull_request` trigger by design. CodeQL's Rust extractor traces a full
# `cargo build` (minutes; rust-cache can't shortcut extraction), so running it
# on every PR would be the slowest gate on the board while only duplicating the
# push→main run that lands seconds after merge. OpenSSF Scorecard's SAST check
# measures coverage of the DEFAULT BRANCH, which push→main fully preserves — so
# dropping the PR trigger costs no Scorecard points. CodeQL is therefore never a
# PR gate; findings surface as code-scanning alerts on main + the weekly cron.

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel an in-progress scan. Each push→main run is a baseline SAST
  # scan of that commit, and Scorecard measures default-branch coverage; with
  # the PR trigger removed there is no second run to compensate, so a cancelled
  # run would leave a commit permanently unscanned.
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (Rust)
    # Runs on every push to main (no path gate) so SAST covers all commits
    # on the default branch — OpenSSF Scorecard's SAST check measures the
    # fraction of default-branch commits scanned, and a `paths-filter` gate
    # would leave doc/chore commits unscanned.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to code-scanning
      actions: read            # required for private repos; harmless on public

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (no semver tags upstream)
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: rust
          queries: security-and-quality

      - name: Autobuild
        # CodeQL's autobuilder runs `cargo build` for Rust. Explicit
        # build steps would only matter for non-default targets.
        uses: github/codeql-action/autobuild@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1

      - name: Perform analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: "/language:rust"
