name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install cargo-dist
        # SHA-pinned per OpenSSF Scorecard (PinnedDependenciesID): download
        # the installer, verify its SHA256, then run it. Bumping cargo-dist
        # means updating both CARGO_DIST_VERSION and CARGO_DIST_INSTALLER_SHA256.
        env:
          CARGO_DIST_VERSION: 0.25.1
          CARGO_DIST_INSTALLER_SHA256: dc739fe6744bea196ac1f25e5216e97567064625a3b1743e90f5e8eae4994b2d
        run: |
          set -euo pipefail
          installer="$(mktemp)"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${CARGO_DIST_VERSION}/cargo-dist-installer.sh" \
            -o "${installer}"
          echo "${CARGO_DIST_INSTALLER_SHA256}  ${installer}" | sha256sum -c -
          sh "${installer}"
          rm -f "${installer}"

      - id: release
        name: Plan release
        # We invoke `cargo dist plan` as a sanity check (it validates the
        # tag + workspace + config) and surface its manifest in the log.
        # The JSON itself is not consumed by downstream jobs, so we don't
        # try to stuff it through $GITHUB_OUTPUT (multi-line values need
        # heredoc syntax and nothing reads it anyway).
        run: |
          cargo dist plan \
            --tag=${{ github.ref_name }} \
            --output-format=json \
            | tee plan.json
          echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (no semver tags upstream)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release
        run: cargo build --release --locked -p lucid-lint --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/lucid-lint dist/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/
          cd dist
          tar czf lucid-lint-${{ needs.plan.outputs.tag }}-${{ matrix.target }}.tar.gz ./*

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/lucid-lint.exe dist/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/
          cd dist
          7z a lucid-lint-${{ needs.plan.outputs.tag }}-${{ matrix.target }}.zip ./*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # softprops/action-gh-release creates the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip

  crates-io:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (no semver tags upstream)
        with:
          toolchain: stable
      - name: Publish to crates.io
        run: cargo publish --locked -p lucid-lint
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
