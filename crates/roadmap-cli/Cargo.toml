[package]
name = "roadmap-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Bastien Gallay <bastien@example.com>"]
description = "Internal tool: generate ROADMAP.md from .roadmap/ frontmatter source. Not published."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "roadmap"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
